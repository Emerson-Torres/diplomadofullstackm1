<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Mi Tienda</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .productos {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .tarjeta {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      width: 200px;
    }

    .tarjeta img {
      width: 100%;
      height: 150px;
      object-fit: contain;
    }

    .tarjeta h3 {
      font-size: 14px;
      margin: 8px 0;
    }

    .tarjeta .precio {
      color: #2563eb;
      font-weight: bold;
    }

    #btn-cargar {
      padding: 8px 16px;
      background-color: #17a2b8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s;
    }

    #btn-cargar:hover {
      background-color: #138496;
    }

    #busqueda {
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 14px;
      width: 250px;
      margin-left: 10px;
    }

    #busqueda:focus {
      outline: none;
      border-color: #80bdff;
      box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }

    #slvCategories {
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 14px;
      background-color: white;
      cursor: pointer;
      transition: border-color 0.3s;
    }

    #slvCategories:focus {
      outline: none;
      border-color: #80bdff;
      box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }
  </style>
</head>

<body>
  <h1>🛍️ Mi Tienda</h1>
  <div id="contenedor" class="productos"></div>


  <br>
  <button id="btn-cargar">Cargar productos</button>
  <select id="slvCategories">

  </select>
  <input type="text" id="busqueda" />
  <script>
    // El patrón completo en su forma más simple
    const btn = document.getElementById("btn-cargar");

    btn.addEventListener("click", async function () {

      // 1. Feedback visual inmediato
      btn.textContent = "Cargando...";
      btn.disabled = true;

      try {
        // 2. Petición a la API
        const res = await fetch("https://fakestoreapi.com/products?limit=4");
        const productos = await res.json();

        // 3. Actualizar el DOM
        const contenedor = document.getElementById("contenedor");
        contenedor.innerHTML = productos.map(p => `
      <div class="tarjeta">
        <img src="${p.image}">
        <h3>${p.title.substring(0, 30)}...</h3>
        <p>$${p.price.toFixed(2)}</p>
      </div>
    `).join("");

      } catch (error) {
        console.error("Error:", error);
      } finally {
        // 4. Restaurar el botón siempre (con o sin error)
        btn.textContent = "Cargar productos";
        btn.disabled = false;
      }
    });


    const inputBusqueda = document.getElementById("busqueda");

    inputBusqueda.addEventListener("input", function () {
      const texto = this.value.toLowerCase();

      // Filtrar tarjetas ya renderizadas en el DOM
      document.querySelectorAll(".tarjeta").forEach(function (tarjeta) {
        const titulo = tarjeta.querySelector("h3").textContent.toLowerCase();
        tarjeta.style.display = titulo.includes(texto) ? "block" : "none";
      });
    });

    document.addEventListener("DOMContentLoaded", async function () {
      const response = await fetch("https://fakestoreapi.com/products/categories");
      const data = await response.json();

      const select = document.getElementById("slvCategories");
      data.forEach(categories => {
        const option = document.createElement("option");
        option.value = categories;
        option.textContent = categories;
        select.appendChild(option);
      });
    });

    document.getElementById("slvCategories").addEventListener("change", async function () {
      const cat = this.value;
      const url = cat
        ? `https://fakestoreapi.com/products/category/${cat}`
        : "https://fakestoreapi.com/products";

      const res = await fetch(url);
      const productos = await res.json();
       const contenedor = document.getElementById("contenedor");
        contenedor.innerHTML = productos.map(p => `
      <div class="tarjeta">
        <img src="${p.image}">
        <h3>${p.title.substring(0, 30)}...</h3>
        <p>$${p.price.toFixed(2)}</p>
      </div>
    `).join("");
    })



  </script>
</body>

</html>
